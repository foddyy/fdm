name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build cache
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --console=plain

      - name: Rename APK
        run: |
          mkdir -p app-output
          cp app/build/outputs/apk/debug/*.apk app-output/careeyes.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeyes-apk
          path: app-output/careeyes.apk
          retention-days: 30
