name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore $GITHUB_WORKSPACE/upload.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass android \
            -keypass android \
            -dname "CN=FaceDistanceMonitor, OU=Dev, O=Personal"
          echo "STORE_FILE=$GITHUB_WORKSPACE/upload.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: List APK outputs
        run: |
          echo "=== Finding APK files ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "release dir not found"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
