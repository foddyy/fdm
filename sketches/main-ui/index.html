<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱眼 - 主界面设计</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px;
  }

  .phone-frame {
    width: 390px;
    height: 844px;
    background: linear-gradient(160deg, #e8f5e9 0%, #f1f8e9 40%, #fffde7 100%);
    border-radius: 44px;
    padding: 16px;
    box-shadow: 
      0 25px 80px rgba(0,0,0,0.12),
      0 10px 30px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.7);
    overflow-y: auto;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px 14px;
    font-size: 13px;
    color: #444;
    font-weight: 600;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-bar .icons { display: flex; gap: 4px; font-size: 12px; }

  /* Card base - glassmorphism */
  .card {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 
      0 4px 16px rgba(0, 0, 0, 0.06),
      0 1px 4px rgba(0, 0, 0, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.5);
    transition: all 0.2s ease;
  }
  
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 8px 24px rgba(0, 0, 0, 0.08),
      0 2px 8px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* Card 1: Header */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  
  .app-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #4db6ac, #00897b);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    box-shadow: 
      0 3px 10px rgba(0, 137, 123, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  
  .app-title {
    font-size: 22px;
    font-weight: 700;
    color: #2c3e50;
    letter-spacing: 2px;
  }
  
  .lang-toggle {
    font-size: 13px;
    color: #26a69a;
    background: rgba(38, 166, 154, 0.08);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid rgba(38, 166, 154, 0.15);
    transition: all 0.2s;
    font-weight: 500;
  }
  
  .lang-toggle:hover {
    background: rgba(38, 166, 154, 0.15);
    border-color: rgba(38, 166, 154, 0.3);
  }

  /* Card 2: Status */
  .card-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px;
    background: linear-gradient(135deg, 
      rgba(255,255,255,0.85) 0%, 
      rgba(232,245,233,0.6) 100%);
  }
  
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); }
    50% { opacity: 0.6; transform: scale(1.15); box-shadow: 0 0 16px rgba(76, 175, 80, 0.7); }
  }
  
  .status-text {
    font-size: 16px;
    color: #555;
    font-weight: 500;
    letter-spacing: 1px;
  }

  /* Card 3: Distance */
  .distance-card {
    text-align: center;
    padding: 24px 18px;
    background: linear-gradient(135deg, 
      rgba(255,255,255,0.8) 0%, 
      rgba(232,245,233,0.4) 100%);
  }
  
  .distance-value {
    font-size: 56px;
    font-weight: 800;
    background: linear-gradient(135deg, #26a69a, #00897b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  
  .distance-unit {
    font-size: 16px;
    color: #999;
    margin-top: 4px;
    font-weight: 400;
  }
  
  .threshold-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 14px;
    color: #666;
  }
  
  .threshold-badge {
    background: linear-gradient(135deg, #ff7043, #f4511e);
    color: white;
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(244, 81, 30, 0.25);
  }

  /* Card 4: Buttons */
  .buttons-card {
    display: flex;
    gap: 14px;
    padding: 20px 18px;
    background: linear-gradient(135deg, 
      rgba(255,255,255,0.75) 0%, 
      rgba(232,245,233,0.3) 100%);
  }
  
  .btn {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }
  
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
    border-radius: 14px 14px 0 0;
    pointer-events: none;
  }
  
  .btn-start {
    background: linear-gradient(135deg, #4db6ac, #00897b);
    color: white;
    box-shadow: 
      0 4px 14px rgba(0, 137, 123, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 6px 20px rgba(0, 137, 123, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  
  .btn-calibrate {
    background: linear-gradient(135deg, #78909c, #455a64);
    color: white;
    box-shadow: 
      0 4px 14px rgba(69, 90, 100, 0.25),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  
  .btn-calibrate:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 6px 20px rgba(69, 90, 100, 0.35),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* Card 5: QR Code */
  .qr-card {
    text-align: center;
    padding: 22px 18px;
  }
  
  .qr-title {
    font-size: 14px;
    color: #999;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  
  .qr-placeholder {
    width: 130px;
    height: 130px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 3px 12px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.04);
  }
  
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    width: 90px;
    height: 90px;
    gap: 2px;
  }
  
  .qr-cell {
    background: #333;
    border-radius: 1px;
  }
  
  .qr-cell.white {
    background: white;
  }

  /* Bottom safe area */
  .bottom-spacer {
    height: 40px;
  }

  /* Preview label */
  .preview-label {
    text-align: center;
    margin-bottom: 20px;
    font-size: 13px;
    color: #bbb;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Hover effects for buttons */
  .btn:active {
    transform: translateY(0) !important;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="preview-label">— 爱眼 主界面 —</div>
  
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">📶 🔋</span>
  </div>

  <!-- Card 1: Header -->
  <div class="card card-header">
    <div class="header-left">
      <div class="app-icon">👁</div>
      <div class="app-title">爱眼</div>
    </div>
    <div class="lang-toggle">EN / 中文</div>
  </div>

  <!-- Card 2: Status -->
  <div class="card card-status">
    <div class="status-dot"></div>
    <div class="status-text">监测中</div>
  </div>

  <!-- Card 3: Distance -->
  <div class="card distance-card">
    <div class="distance-value">42</div>
    <div class="distance-unit">cm</div>
    <div class="threshold-row">
      <span>安全阈值</span>
      <span class="threshold-badge">≥ 30 cm</span>
    </div>
  </div>

  <!-- Card 4: Buttons -->
  <div class="card buttons-card">
    <button class="btn btn-start">开始监测</button>
    <button class="btn btn-calibrate">校准距离</button>
  </div>

  <!-- Card 5: QR Code -->
  <div class="card qr-card">
    <div class="qr-title">打赏支持开发 ☕</div>
    <div class="qr-placeholder">
      <div class="qr-grid">
        <div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell white"></div><div class="qr-cell"></div>
        <div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div>
      </div>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</div>

</body>
</html>
